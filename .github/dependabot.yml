version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      # Ship every github.com/gomlx/* module in one pull request.
      gomlx:
        patterns:
          - "github.com/gomlx/*"
